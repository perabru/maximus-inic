<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação visual · INIC</title><style>body{margin:0;background:#ececf3;font:14px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#212044;color:white;position:sticky;top:0;z-index:10}header span{margin-right:auto}button{padding:8px 12px;border:1px solid #a2a0c1;border-radius:8px;background:#fff;color:#29264c;cursor:pointer}iframe{display:block;width:100%;height:calc(100vh - 62px);border:0;margin:auto;background:white;transition:width .2s}</style><header><span>Validação visual — somente dados fictícios</span><button id="desktop">Computador</button><button id="mobile">Celular 390px</button><button id="narrow">Celular 320px</button><button data-view="indicators">Indicadores</button><button data-view="people">Pessoas</button><button data-view="calendar">Calendário</button><button id="theme">Modo claro / escuro</button><button id="update">Atualizar dados de teste</button><button id="offline">Alternar conexão</button></header><iframe title="Prévia do aplicativo" src="inic-preview-frame.html?v=20261113-1"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#desktop').onclick=()=>frame.style.width='100%';document.querySelector('#mobile').onclick=()=>frame.style.width='390px';document.querySelector('#narrow').onclick=()=>frame.style.width='320px';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({view:b.dataset.view},location.origin));document.querySelector('#theme').onclick=()=>frame.contentWindow.postMessage({theme:true},location.origin);document.querySelector('#update').onclick=()=>frame.contentWindow.postMessage({update:true},location.origin);document.querySelector('#offline').onclick=()=>frame.contentWindow.postMessage({offline:true},location.origin);</script></html>
