<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prévia de validação · INIC</title>
<link rel="stylesheet" href="../../portal.css"><link rel="stylesheet" href="../../coordination-dashboard.css"><link rel="stylesheet" href="../../calendar.css?v=20261113-1"><link rel="stylesheet" href="../../uiverse-components.css"><link rel="stylesheet" href="../../experience.css"><link rel="stylesheet" href="../../responsive.css"><link rel="stylesheet" href="../../brand-typography.css"><link rel="stylesheet" href="../../readability.css"><link rel="stylesheet" href="../../filter-controls.css"><link rel="stylesheet" href="../../community.css">
<div class="app-shell"><aside class="sidebar"><img src="../../assets/logo-maximus.png" alt="Escola Máximu’s"><div class="app-label">MEU INIC · TESTE</div><nav class="app-nav"><a href="#indicadores" aria-current="page">Indicadores INIC</a><a href="#pessoas">Pessoas</a><a href="#calendario">Calendário</a></nav><div class="sidebar-note"><p>Prévia de validação. Os dados desta página são fictícios e não são enviados ao aplicativo.</p></div></aside><div class="workspace"><header class="app-header"><div><p class="eyebrow">AMBIENTE DE VALIDAÇÃO</p><h1 id="page-title">Indicadores INIC</h1></div><span>Dados fictícios</span></header><main class="app-main" id="preview"></main></div></div>
<script type="module">
import {createCoordinationDashboard} from './../../coordination-dashboard.js';
import {createCommunityView} from './../../community.js';
import {createCalendarView} from './../../calendar.js?v=20261113-1';
const advisors=['Orientadora A — teste','Orientador B — teste','Orientadora C — teste'].map((name,i)=>({id:'t'+i,name,role:'advisor',listedAdvisor:true}));
const students=Array.from({length:18},(_,i)=>({id:'s'+i,name:`Estudante ${String(i+1).padStart(2,'0')} — teste`,role:'student',year:'2º ano'}));
const groups=['Água e sustentabilidade','Tecnologia na educação','Cultivo inteligente','Energia renovável','Robótica e acessibilidade','Saúde e meio ambiente'].map((name,i)=>({id:'g'+i,name,year:2027,advisorId:i===5?'':advisors[i%3].id,members:Object.fromEntries(students.slice(i*3,i*3+3).map(s=>[s.id,true]))}));
const state={user:{uid:'coordinator-preview'},role:'coordinator',users:[...students,...advisors],advisors,groups};
const statuses=['approved','approved','pending','correction','approved','rejected'];
let data={ready:true,connected:true,boards:Array.from({length:12},(_,i)=>({id:'b'+i,groupId:'g'+(i%6),year:2027,title:`Banca de validação ${i+1}`,date:`2027-${String([3,4,5,6,8,9,9,10,10,10,11,12][i]).padStart(2,'0')}-20`,status:statuses[i%6],correction:statuses[i%6]==='correction'?'Revisar as referências bibliográficas.':'',updatedAt:i+1})),results:students.map((s,i)=>({groupId:'g'+Math.floor(i/3),studentUid:s.id,status:statuses[i%6],correction:statuses[i%6]==='correction'?'Conferir os resultados e a conclusão.':'',updatedAt:i+1,updatedByName:'Coordenação de teste',updatedByRole:'coordinator'})),tasks:groups.flatMap((g,i)=>Array.from({length:6},(_,j)=>({id:'etapa'+j,groupId:g.id,weight:1,completed:j<(6-i),dueDate:'2027-06-10',updatedAt:j+1})))};
let callback,edition=2027;
const service={subscribeCoordinationMetrics(year,cb){edition=year;callback=cb;cb(year===2027?data:{ready:true,connected:data.connected,boards:[],results:[],tasks:[]});return()=>{};},saveInicBoard:async()=>{throw new Error('Prévia: nenhum dado é enviado.');},deleteInicBoard:async()=>{throw new Error('Prévia: nenhum dado é enviado.');}};
const dashboard=createCoordinationDashboard({service,state});
const people=[{id:'available',name:'Estudante disponível — teste',role:'student',year:'2º ano'},{id:'long-name',name:'Estudante com nome completo extenso para conferir a leitura — teste',role:'student',year:'2º ano'},{id:'other-year',name:'Estudante de outra série — teste',role:'student',year:'1º ano'},{id:'member',name:'Estudante já em grupo — teste',role:'student',year:'2º ano',groupId:'g1'},...advisors];
const community=createCommunityView({people,ready:true,currentUid:'preview-student',currentRole:'student',currentYear:'2º ano',onInvite:()=>{document.querySelector('#page-title').textContent='Ação de teste — nenhum convite enviado';}});
const calendarState={};
let calendarUpdates=0,currentView='indicators';
const calendarTasks=[
  {id:'intro',groupId:'g0',title:'Primeira versão da introdução',dueDate:'2027-01-08',completed:true},
  {id:'method',groupId:'g0',title:'Metodologia e planejamento dos experimentos',dueDate:'2027-01-15',completed:false,description:'Detalhar materiais e procedimentos. Dados de teste.'},
  {id:'results',groupId:'g1',title:'Organização dos resultados da pesquisa',dueDate:'2027-01-15',completed:false},
  {id:'references',groupId:'g0',title:'Revisão das referências',dueDate:'2027-01-15',completed:true},
  {id:'article',groupId:'g1',title:'Enviar o artigo para revisão do orientador',dueDate:'2027-01-21',completed:false}
];
let calendarEvents=[
  {id:'orientation',groupId:'g0',title:'Encontro de orientação',date:'2027-01-15',description:'Sala de pesquisa — compromisso fictício.'},
  {id:'workshop',groupId:'g1',title:'Oficina de escrita científica',date:'2027-01-15',description:'Levar o rascunho do artigo. Dados de teste.'},
  {id:'review',groupId:'g1',title:'Revisão em equipe',date:'2027-01-26'}
];
function calendarAction(title,details){
  const dialog=document.createElement('dialog');dialog.className='dialog';
  const heading=document.createElement('h2');heading.textContent=title;
  const copy=document.createElement('p');copy.textContent=details;
  const note=document.createElement('p');note.textContent='Prévia com dados fictícios. Nenhuma alteração será enviada ao aplicativo.';
  const close=document.createElement('button');close.className='button secondary';close.textContent='Fechar';close.onclick=()=>{dialog.close();dialog.remove();};
  dialog.append(heading,copy,note,close);document.body.append(dialog);dialog.showModal();
}
function calendarPreview(){return createCalendarView({groups,tasks:calendarTasks,events:calendarEvents,viewState:calendarState,initialDate:new Date(2027,0,1,12),canManageGroup:group=>['g0','g1'].includes(group.id),onAddEvent:(groupId,date)=>calendarAction('Novo evento — teste',`${date} · ${groups.find(group=>group.id===groupId)?.name||'Selecionar grupo'}`),onEditEvent:event=>calendarAction(event.title,event.date),onTask:task=>calendarAction(task.title,task.dueDate)});}
function view(name){currentView=name;document.querySelector('#preview').replaceChildren(name==='people'?community.element:name==='calendar'?calendarPreview():dashboard.element);document.querySelector('#page-title').textContent=name==='people'?'Comunidade INIC':name==='calendar'?'Calendário INIC':'Indicadores INIC';document.querySelectorAll('.app-nav a').forEach(a=>{const active=a.hash===(name==='people'?'#pessoas':name==='calendar'?'#calendario':'#indicadores');if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}

view('indicators');
addEventListener('message',event=>{if(event.origin!==location.origin)return;const message=event.data;if(message.view)view(message.view);if(message.theme)document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';if(message.offline){data={...data,connected:!data.connected};callback(edition===2027?data:{ready:true,connected:data.connected,boards:[],results:[],tasks:[]});}if(message.update){if(currentView==='calendar'){calendarUpdates++;calendarEvents=[...calendarEvents,{id:'new'+calendarUpdates,groupId:'g0',title:'Novo encontro de teste '+calendarUpdates,date:'2027-01-15'}];view('calendar');return;}data={...data,boards:[...data.boards,{id:'b'+(data.boards.length+1),groupId:'g1',year:2027,title:'Nova banca de teste',date:'2027-10-22',status:'approved',updatedAt:Date.now()}],tasks:data.tasks.map((item,i)=>i===data.boards.length%data.tasks.length?{...item,completed:!item.completed,updatedAt:Date.now()}:item)};callback(data);}});
document.querySelectorAll('.app-nav a').forEach(a=>a.onclick=event=>{event.preventDefault();view(a.hash==='#pessoas'?'people':a.hash==='#calendario'?'calendar':'indicators');});
</script></html>
